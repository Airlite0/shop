{% extends 'main/base.html' %}
{% load static %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto my-10 p-4">
    <!-- Назад до списку товарів -->
    <a href="{% url 'main:product_list' %}" class="text-blue-500 hover:underline mb-6 inline-block">
        ← Повернутися до товарів
    </a>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Зображення товару -->
        <div class="flex justify-center items-center">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}" class="rounded-lg object-cover max-h-[400px]">
            {% else %}
                <img src="{% static 'images/default-product.jpg' %}" alt="{{ product.name }}" class="rounded-lg object-cover max-h-[400px]">
            {% endif %}
        </div>

        <!-- Інформація про товар -->
        <div>
            <h1 class="text-2xl font-bold mb-4">{{ product.name }}</h1>
            <p class="mb-4">{{ product.description }}</p>
            <p class="text-xl font-semibold mb-2">Ціна: {{ product.price }} грн</p>
        </div>
    </div>
</div>
{% endblock %}
